<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Hanoi — AI harness in Go</title>
  <desc id="desc">Hanoi logo: a cyan and mint Tower of Hanoi with a terminal prompt beside a custom geometric lowercase hanoi wordmark, on a midnight-blue background.</desc>
  <rect width="960" height="320" rx="32" fill="#101d2f"/>
  <g transform="translate(32 32)">
    <g fill="none" stroke="#34485e" stroke-width="8" stroke-linecap="round">
      <path d="M46 190V135M128 190V60M210 190V135"/>
    </g>
    <rect x="104" y="76" width="48" height="19" rx="9.5" fill="#a7f3d0"/>
    <rect x="91" y="104" width="74" height="19" rx="9.5" fill="#67e8d0"/>
    <rect x="78" y="132" width="100" height="19" rx="9.5" fill="#36d7d4"/>
    <rect x="65" y="160" width="126" height="19" rx="9.5" fill="#22b9d1"/>
    <path d="M38 196H218" fill="none" stroke="#e7f2fa" stroke-width="8" stroke-linecap="round"/>
    <g fill="none" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m188 78 12 10-12 10m18 0h12"/>
    </g>
  </g>
  <!-- The wordmark is drawn as paths and needs no installed fonts. -->
  <g transform="translate(350 75)" fill="none" stroke="#e7f2fa" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 112V10M0 72C0 35 58 35 58 72V112"/>
    <path d="M151 51V112M151 80C151 36 91 36 91 80S151 124 151 80"/>
    <path d="M186 112V51M186 72C186 35 244 35 244 72V112"/>
    <rect x="278" y="47" width="61" height="69" rx="30.5"/>
    <path d="M377 54V112"/>
  </g>
  <circle cx="727" cy="95" r="8" fill="#67e8d0"/>
  <path d="M768 190H803" stroke="#67e8d0" stroke-width="10" stroke-linecap="round"/>
  <text x="350" y="239" fill="#a8bdce" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" letter-spacing="3">AI HARNESS IN GO</text>
</svg>
